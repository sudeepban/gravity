<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Explorer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a1a; color: #e0e0f0; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }

  header { background: #111130; padding: 12px 20px; display: flex; align-items: center; gap: 20px; border-bottom: 1px solid #2a2a5a; flex-shrink: 0; }
  header h1 { font-size: 1.4rem; color: #7af; letter-spacing: 1px; }
  .scenario-tabs { display: flex; gap: 6px; }
  .tab { padding: 6px 14px; border-radius: 20px; border: 1px solid #3a3a6a; background: transparent; color: #99b; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
  .tab.active { background: #2255aa; border-color: #4488ff; color: #fff; }
  .tab:hover:not(.active) { border-color: #7af; color: #ddf; }

  main { display: flex; flex: 1; overflow: hidden; }

  #canvas-area { flex: 1; position: relative; }
  canvas { width: 100%; height: 100%; display: block; }
  #stats { position: absolute; top: 10px; left: 10px; background: rgba(0,0,20,0.75); border: 1px solid #2a2a5a; border-radius: 8px; padding: 10px 14px; font-size: 0.78rem; line-height: 1.7; min-width: 200px; }
  #stats .label { color: #88aadd; }
  #stats .val { color: #7fffaa; font-family: monospace; }

  #panel { width: 300px; background: #0d0d28; border-left: 1px solid #2a2a5a; display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; }
  .panel-section { padding: 14px 16px; border-bottom: 1px solid #1a1a3a; }
  .panel-section h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #556; margin-bottom: 10px; }

  .control { margin-bottom: 12px; }
  .control label { display: flex; justify-content: space-between; font-size: 0.82rem; color: #aac; margin-bottom: 4px; }
  .control label span { color: #7fffaa; font-family: monospace; }
  input[type=range] { width: 100%; accent-color: #4488ff; cursor: pointer; }

  .eq-box { background: #050515; border: 1px solid #2a2a5a; border-radius: 6px; padding: 10px 12px; font-family: monospace; font-size: 0.82rem; line-height: 1.9; color: #aad; }
  .eq-box .eq { color: #ffdd88; }
  .eq-box .sub { color: #88ccff; font-size: 0.75rem; }

  .btn { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #3a5a9a; background: #1a3a6a; color: #adf; cursor: pointer; font-size: 0.85rem; margin-top: 6px; transition: background 0.15s; }
  .btn:hover { background: #2255aa; }
  .btn.danger { border-color: #7a3a3a; background: #3a1a1a; color: #faa; }
  .btn.danger:hover { background: #5a2020; }

  #info-bar { background: #070720; border-top: 1px solid #1a1a4a; padding: 6px 16px; font-size: 0.75rem; color: #446; flex-shrink: 0; }

  .planet-select { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .planet-btn { padding: 4px 10px; border-radius: 12px; border: 1px solid #2a3a5a; background: #0a1025; color: #88aacc; cursor: pointer; font-size: 0.78rem; transition: all 0.15s; }
  .planet-btn.active { background: #1a3060; border-color: #4488cc; color: #adf; }
</style>
</head>
<body>
<header>
  <h1>&#9873; Gravity Explorer</h1>
  <div class="scenario-tabs">
    <button class="tab active" onclick="setScenario('freefall')">Free Fall</button>
    <button class="tab" onclick="setScenario('projectile')">Projectile</button>
    <button class="tab" onclick="setScenario('orbit')">Orbital</button>
  </div>
</header>

<main>
  <div id="canvas-area">
    <canvas id="c"></canvas>
    <div id="stats"></div>
  </div>
  <div id="panel">
    <div class="panel-section" id="planet-section">
      <h3>Body / Environment</h3>
      <div class="planet-select" id="planet-btns"></div>
    </div>
    <div class="panel-section" id="controls-section">
      <h3>Parameters</h3>
      <div id="controls"></div>
    </div>
    <div class="panel-section">
      <h3>Equations</h3>
      <div class="eq-box" id="equations"></div>
    </div>
    <div class="panel-section">
      <h3>Simulation</h3>
      <button class="btn" onclick="toggleSim()">&#9654; Run / Pause</button>
      <button class="btn" onclick="resetSim()">&#8635; Reset</button>
      <div class="control" style="margin-top:10px">
        <label>Speed <span id="speed-val">1x</span></label>
        <input type="range" id="speed" min="0.1" max="5" step="0.1" value="1" oninput="simSpeed=+this.value;document.getElementById('speed-val').textContent=simSpeed.toFixed(1)+'x'">
      </div>
    </div>
  </div>
</main>
<div id="info-bar">Click canvas to interact &bull; Drag sliders to change parameters &bull; Switch scenarios above</div>

<script>
// ─── Celestial bodies ────────────────────────────────────────────────────────
const BODIES = {
  Earth:   { g: 9.81,  radius: 6.371e6, mass: 5.972e24, color: '#3a8fff', label: '🌍' },
  Moon:    { g: 1.62,  radius: 1.737e6, mass: 7.342e22, color: '#aaa',    label: '🌕' },
  Mars:    { g: 3.72,  radius: 3.390e6, mass: 6.390e23, color: '#c84',    label: '🔴' },
  Jupiter: { g: 24.79, radius: 6.991e7, mass: 1.899e27, color: '#e96',    label: '🪐' },
  Sun:     { g: 274,   radius: 6.957e8, mass: 1.989e30, color: '#ff9',    label: '☀️' },
};

// ─── State ────────────────────────────────────────────────────────────────────
let scenario = 'freefall';
let planet = 'Earth';
let running = false;
let simSpeed = 1;
let t = 0;
let animId = null;
let lastTime = null;
let params = {};
let trailPoints = [];

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ─── Resize ───────────────────────────────────────────────────────────────────
function resize() {
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
  draw();
}
window.addEventListener('resize', resize);

// ─── Scenario configs ─────────────────────────────────────────────────────────
const SCENARIOS = {
  freefall: {
    params: () => [
      { id: 'h0', label: 'Initial Height (m)', min: 1, max: 500, step: 1, def: 100 },
      { id: 'v0', label: 'Initial Velocity (m/s)', min: -50, max: 50, step: 1, def: 0 },
      { id: 'mass', label: 'Object Mass (kg)', min: 0.1, max: 1000, step: 0.1, def: 1 },
    ],
    equations: (p, g) => `
<span class="eq">y(t) = h₀ + v₀t − ½gt²</span>
<span class="sub">h₀ = ${p.h0} m, v₀ = ${p.v0} m/s</span>
<span class="eq">v(t) = v₀ − gt</span>
<span class="eq">KE = ½mv² = ${(0.5*p.mass*(p.v0||0)**2).toFixed(1)} J</span>
<span class="eq">PE = mgh = ${(p.mass*g*p.h0).toFixed(1)} J</span>
<span class="sub">g = ${g} m/s²</span>`,
    simulate: (p, g, t) => {
      const y = p.h0 + p.v0*t - 0.5*g*t*t;
      const v = p.v0 - g*t;
      const tHit = (p.v0 + Math.sqrt(p.v0**2 + 2*g*p.h0))/g;
      return { y: Math.max(0, y), v, hit: y <= 0, tHit };
    },
    stats: (s, p, g) => ({
      'Height': s.y.toFixed(2) + ' m',
      'Velocity': s.v.toFixed(2) + ' m/s',
      'KE': (0.5*p.mass*s.v**2).toFixed(1) + ' J',
      'PE': (p.mass*g*Math.max(0,s.y)).toFixed(1) + ' J',
      'Time': t.toFixed(2) + ' s',
    }),
    draw: drawFreefall,
  },
  projectile: {
    params: () => [
      { id: 'v0', label: 'Muzzle Speed (m/s)', min: 10, max: 500, step: 1, def: 80 },
      { id: 'angle', label: 'Launch Angle (°)', min: 1, max: 89, step: 1, def: 45 },
      { id: 'h0', label: 'Launch Height (m)', min: 0, max: 200, step: 1, def: 0 },
    ],
    equations: (p, g) => {
      const a = p.angle * Math.PI/180;
      const vx = p.v0*Math.cos(a), vy = p.v0*Math.sin(a);
      const range = (vx*(vy + Math.sqrt(vy**2+2*g*p.h0)))/g;
      const tMax = (vy + Math.sqrt(vy**2+2*g*p.h0))/g;
      const maxH = p.h0 + vy**2/(2*g);
      return `
<span class="eq">x(t) = v₀cos(θ)·t</span>
<span class="eq">y(t) = h₀ + v₀sin(θ)·t − ½gt²</span>
<span class="sub">θ = ${p.angle}°, v₀ = ${p.v0} m/s</span>
<span class="eq">Range ≈ ${range.toFixed(1)} m</span>
<span class="eq">Max Height ≈ ${maxH.toFixed(1)} m</span>
<span class="eq">Flight Time ≈ ${tMax.toFixed(2)} s</span>`;
    },
    simulate: (p, g, t) => {
      const a = p.angle * Math.PI/180;
      const vx = p.v0*Math.cos(a), vy = p.v0*Math.sin(a);
      const x = vx*t;
      const y = p.h0 + vy*t - 0.5*g*t*t;
      const tMax = (vy + Math.sqrt(vy**2+2*g*p.h0))/g;
      return { x, y: Math.max(0, y), vx, vy: vy - g*t, hit: y <= 0, tHit: tMax };
    },
    stats: (s, p, g) => ({
      'X': s.x.toFixed(1) + ' m',
      'Y': s.y.toFixed(1) + ' m',
      'Vx': s.vx.toFixed(1) + ' m/s',
      'Vy': s.vy.toFixed(1) + ' m/s',
      'Speed': Math.sqrt(s.vx**2+s.vy**2).toFixed(1) + ' m/s',
      'Time': t.toFixed(2) + ' s',
    }),
    draw: drawProjectile,
  },
  orbit: {
    params: () => [
      { id: 'altitude', label: 'Orbital Altitude (km)', min: 100, max: 50000, step: 100, def: 400 },
      { id: 'ecc', label: 'Eccentricity', min: 0, max: 0.95, step: 0.01, def: 0 },
    ],
    equations: (p, body) => {
      const G = 6.674e-11;
      const M = body.mass;
      const R = body.radius;
      const a = R + p.altitude*1000;
      const v = Math.sqrt(G*M/a);
      const T = 2*Math.PI*Math.sqrt(a**3/(G*M));
      const ve = Math.sqrt(2*G*M/a);
      return `
<span class="eq">v = √(GM/r)</span>
<span class="sub">Orbital speed at ${p.altitude} km alt</span>
<span class="eq">v ≈ ${(v/1000).toFixed(2)} km/s</span>
<span class="eq">T = 2π√(a³/GM)</span>
<span class="eq">T ≈ ${(T/60).toFixed(1)} min</span>
<span class="eq">v_escape ≈ ${(ve/1000).toFixed(2)} km/s</span>
<span class="sub">e = ${p.ecc} (eccentricity)</span>`;
    },
    simulate: (p, body, t) => {
      const G = 6.674e-11;
      const M = body.mass;
      const R = body.radius;
      const a = R + p.altitude*1000;
      const b = a * Math.sqrt(1 - p.ecc**2);
      const T = 2*Math.PI*Math.sqrt(a**3/(G*M));
      const angle = (2*Math.PI*t/T);
      // Eccentric anomaly approximation for low eccentricity
      const E = angle + p.ecc*Math.sin(angle);
      const x = a*Math.cos(E) - a*p.ecc;
      const y = b*Math.sin(E);
      const r = Math.sqrt(x**2+y**2);
      const v = Math.sqrt(G*M*(2/r - 1/a));
      return { x, y, r, v, T, a, b };
    },
    stats: (s, p, body) => {
      const alt = (s.r - body.radius)/1000;
      return {
        'Altitude': alt.toFixed(1) + ' km',
        'Speed': (s.v/1000).toFixed(3) + ' km/s',
        'Period': (s.T/60).toFixed(1) + ' min',
        'Time': t.toFixed(0) + ' s',
      };
    },
    draw: drawOrbit,
  },
};

// ─── Draw functions ───────────────────────────────────────────────────────────
function drawFreefall(p, g, state) {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  drawStars();

  const maxH = p.h0 * 1.3 + 20;
  const scale = (H - 60) / maxH;
  const groundY = H - 30;
  const cx = W/2;

  // Ground
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(0, groundY, W, H - groundY);
  ctx.strokeStyle = '#2d6b2d';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();

  // Height ruler
  ctx.strokeStyle = '#223355';
  ctx.lineWidth = 1;
  ctx.setLineDash([4,6]);
  ctx.beginPath(); ctx.moveTo(cx+60, 20); ctx.lineTo(cx+60, groundY); ctx.stroke();
  ctx.setLineDash([]);
  const ticks = 5;
  for(let i=0; i<=ticks; i++) {
    const ht = (maxH/ticks)*i;
    const ty = groundY - ht*scale;
    ctx.fillStyle = '#446';
    ctx.font = '10px monospace';
    ctx.fillText(ht.toFixed(0)+'m', cx+64, ty+4);
    ctx.strokeStyle = '#334';
    ctx.beginPath(); ctx.moveTo(cx+58,ty); ctx.lineTo(cx+62,ty); ctx.stroke();
  }

  // Trail
  trailPoints.push({ y: state.y });
  if(trailPoints.length > 120) trailPoints.shift();
  for(let i=1; i<trailPoints.length; i++) {
    const alpha = i/trailPoints.length;
    ctx.strokeStyle = `rgba(80,160,255,${alpha*0.5})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, groundY - trailPoints[i-1].y*scale);
    ctx.lineTo(cx, groundY - trailPoints[i].y*scale);
    ctx.stroke();
  }

  // Ball
  const ballY = groundY - state.y*scale;
  const grd = ctx.createRadialGradient(cx-4, ballY-4, 2, cx, ballY, 16);
  grd.addColorStop(0, '#88ccff');
  grd.addColorStop(1, '#1155aa');
  ctx.beginPath();
  ctx.arc(cx, ballY, 16, 0, 2*Math.PI);
  ctx.fillStyle = grd;
  ctx.fill();
  ctx.strokeStyle = '#7af';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Velocity arrow
  const arrowLen = Math.min(60, Math.abs(state.v) * 1.5);
  const dir = state.v < 0 ? 1 : -1;
  if(Math.abs(state.v) > 0.1) {
    ctx.strokeStyle = '#ff8844';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx+24, ballY);
    ctx.lineTo(cx+24, ballY + dir*arrowLen);
    ctx.stroke();
    ctx.fillStyle = '#ff8844';
    ctx.beginPath();
    ctx.moveTo(cx+24, ballY + dir*arrowLen);
    ctx.lineTo(cx+20, ballY + dir*(arrowLen-10));
    ctx.lineTo(cx+28, ballY + dir*(arrowLen-10));
    ctx.fill();
    ctx.font = '10px monospace';
    ctx.fillStyle = '#ff8844';
    ctx.fillText('v', cx+30, ballY + dir*(arrowLen/2));
  }

  // Impact marker
  if(state.hit) {
    ctx.strokeStyle = '#ffaa44';
    ctx.lineWidth = 2;
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(cx-30, groundY); ctx.lineTo(cx+30, groundY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#ffaa44';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText('IMPACT!', cx-28, groundY-8);
  }
}

function drawProjectile(p, g, state) {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  drawStars();

  const a = p.angle * Math.PI/180;
  const vx = p.v0*Math.cos(a), vy = p.v0*Math.sin(a);
  const tFlight = (vy + Math.sqrt(vy**2+2*g*p.h0))/g;
  const maxX = vx * tFlight;
  const maxY = p.h0 + vy**2/(2*g);

  const padX = 60, padY = 40;
  const scaleX = (W - 2*padX) / (maxX * 1.05);
  const scaleY = (H - padY - 40) / (maxY * 1.3 + p.h0 + 5);
  const groundY = H - 40;

  // Ground
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(0, groundY, W, H-groundY);
  ctx.strokeStyle = '#2d6b2d'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,groundY); ctx.lineTo(W,groundY); ctx.stroke();

  // Trajectory preview
  ctx.strokeStyle = 'rgba(100,150,255,0.2)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([5,5]);
  ctx.beginPath();
  const steps = 200;
  for(let i=0; i<=steps; i++) {
    const tt = (tFlight/steps)*i;
    const px = vx*tt;
    const py = p.h0 + vy*tt - 0.5*g*tt*tt;
    if(py < 0) break;
    const sx = padX + px*scaleX;
    const sy = groundY - py*scaleY;
    i===0 ? ctx.moveTo(sx,sy) : ctx.lineTo(sx,sy);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // Trail
  trailPoints.push({ x: state.x, y: state.y });
  if(trailPoints.length > 200) trailPoints.shift();
  for(let i=1; i<trailPoints.length; i++) {
    const alpha = i/trailPoints.length;
    ctx.strokeStyle = `rgba(120,200,80,${alpha*0.7})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(padX + trailPoints[i-1].x*scaleX, groundY - trailPoints[i-1].y*scaleY);
    ctx.lineTo(padX + trailPoints[i].x*scaleX,   groundY - trailPoints[i].y*scaleY);
    ctx.stroke();
  }

  // Cannon
  const cannonX = padX, cannonY = groundY - p.h0*scaleY;
  ctx.save();
  ctx.translate(cannonX, cannonY);
  ctx.fillStyle = '#556';
  ctx.beginPath(); ctx.arc(0,0,12,0,2*Math.PI); ctx.fill();
  ctx.rotate(-p.angle*Math.PI/180);
  ctx.fillStyle = '#778';
  ctx.fillRect(0,-6,36,12);
  ctx.restore();

  // Ball
  const bx = padX + state.x*scaleX;
  const by = groundY - state.y*scaleY;
  const grd = ctx.createRadialGradient(bx-3,by-3,2,bx,by,12);
  grd.addColorStop(0,'#aaffaa'); grd.addColorStop(1,'#226622');
  ctx.beginPath(); ctx.arc(bx, by, 12, 0, 2*Math.PI);
  ctx.fillStyle = grd; ctx.fill();
  ctx.strokeStyle='#8f8'; ctx.lineWidth=1.5; ctx.stroke();

  // Range label
  if(state.hit) {
    ctx.fillStyle = '#ffcc44';
    ctx.font = '12px monospace';
    ctx.fillText(`Range: ${state.x.toFixed(1)} m`, padX + state.x*scaleX - 40, groundY + 20);
  }
}

function drawOrbit(p, body, state) {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  drawStars();

  const cx = W/2, cy = H/2;
  const displayRadius = Math.min(W,H)*0.12;
  const scale = displayRadius / body.radius;
  const da = state.a * scale;
  const db = state.b * scale;
  const offset = da * p.ecc * scale / state.a;  // focus offset in display units
  const focusX = cx - state.a * p.ecc * scale;

  // Planet
  const bodyGrd = ctx.createRadialGradient(cx-displayRadius*0.3, cy-displayRadius*0.3, 2, cx, cy, displayRadius);
  bodyGrd.addColorStop(0, lighten(body.color, 60));
  bodyGrd.addColorStop(1, body.color);
  ctx.beginPath(); ctx.arc(cx, cy, displayRadius, 0, 2*Math.PI);
  ctx.fillStyle = bodyGrd; ctx.fill();

  // Orbit ellipse (centered at focus = planet center)
  ctx.strokeStyle = 'rgba(100,150,255,0.25)';
  ctx.lineWidth = 1;
  ctx.setLineDash([5,6]);
  ctx.beginPath();
  ctx.ellipse(cx + state.a*p.ecc*scale, cy, da, db, 0, 0, 2*Math.PI);
  ctx.stroke();
  ctx.setLineDash([]);

  // Trail
  trailPoints.push({ x: state.x*scale, y: state.y*scale });
  if(trailPoints.length > 300) trailPoints.shift();
  for(let i=1; i<trailPoints.length; i++) {
    const alpha = i/trailPoints.length;
    ctx.strokeStyle = `rgba(180,220,255,${alpha*0.6})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(cx + trailPoints[i-1].x, cy - trailPoints[i-1].y);
    ctx.lineTo(cx + trailPoints[i].x,   cy - trailPoints[i].y);
    ctx.stroke();
  }

  // Spacecraft
  const sx = cx + state.x*scale;
  const sy = cy - state.y*scale;
  ctx.fillStyle = '#aaeeff';
  ctx.beginPath(); ctx.arc(sx, sy, 6, 0, 2*Math.PI); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(sx-10, sy); ctx.lineTo(sx+10, sy);
  ctx.moveTo(sx, sy-4); ctx.lineTo(sx, sy+4);
  ctx.stroke();

  // Labels
  ctx.fillStyle = '#aac';
  ctx.font = '13px sans-serif';
  ctx.fillText(body.label + ' ' + planet, cx - 16, cy + displayRadius + 18);

  // Altitude line
  ctx.strokeStyle = 'rgba(255,200,100,0.4)';
  ctx.setLineDash([3,5]);
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(sx, sy); ctx.stroke();
  ctx.setLineDash([]);
}

function drawStars() {
  // Simple static starfield seeded
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  const seed = 42;
  for(let i=0; i<120; i++) {
    const x = ((Math.sin(i*seed*0.1)*0.5+0.5)*canvas.width)|0;
    const y = ((Math.cos(i*seed*0.07)*0.5+0.5)*canvas.height)|0;
    const r = (i%5===0) ? 1.5 : 0.8;
    ctx.beginPath(); ctx.arc(x,y,r,0,2*Math.PI); ctx.fill();
  }
}

function lighten(hex, amt) {
  let r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  r=Math.min(255,r+amt); g=Math.min(255,g+amt); b=Math.min(255,b+amt);
  return `rgb(${r},${g},${b})`;
}

// ─── Stats display ─────────────────────────────────────────────────────────────
function updateStats(map) {
  const el = document.getElementById('stats');
  el.innerHTML = Object.entries(map).map(([k,v]) =>
    `<span class="label">${k}:</span> <span class="val">${v}</span><br>`
  ).join('');
}

// ─── Simulation loop ──────────────────────────────────────────────────────────
function tick(ts) {
  if(!running) return;
  if(lastTime === null) lastTime = ts;
  const dt = Math.min((ts - lastTime)/1000, 0.05) * simSpeed;
  lastTime = ts;
  t += dt;

  const sc = SCENARIOS[scenario];
  const g = BODIES[planet].g;
  const body = BODIES[planet];
  const p = params;

  let state;
  if(scenario === 'orbit') {
    state = sc.simulate(p, body, t);
  } else {
    state = sc.simulate(p, g, t);
    if(state.hit) { running = false; }
  }

  sc.draw(p, scenario==='orbit' ? body : g, state);
  updateStats(sc.stats(state, p, body));

  if(running) animId = requestAnimationFrame(tick);
}

// ─── Controls ─────────────────────────────────────────────────────────────────
function buildControls() {
  const sc = SCENARIOS[scenario];
  const defs = sc.params();
  const ctrl = document.getElementById('controls');
  ctrl.innerHTML = '';
  params = {};
  defs.forEach(d => {
    params[d.id] = d.def;
    const div = document.createElement('div');
    div.className = 'control';
    div.innerHTML = `<label>${d.label} <span id="v-${d.id}">${d.def}</span></label>
      <input type="range" min="${d.min}" max="${d.max}" step="${d.step}" value="${d.def}"
        oninput="params['${d.id}']=+this.value;document.getElementById('v-${d.id}').textContent=this.value;updateEquations();draw()">`;
    ctrl.appendChild(div);
  });
  updateEquations();
}

function updateEquations() {
  const sc = SCENARIOS[scenario];
  const body = BODIES[planet];
  const g = body.g;
  document.getElementById('equations').innerHTML =
    scenario==='orbit'
      ? sc.equations(params, body)
      : sc.equations(params, g);
}

function buildPlanetBtns() {
  const container = document.getElementById('planet-btns');
  container.innerHTML = '';
  Object.entries(BODIES).forEach(([name, b]) => {
    const btn = document.createElement('button');
    btn.className = 'planet-btn' + (name===planet ? ' active' : '');
    btn.textContent = b.label + ' ' + name;
    btn.onclick = () => {
      planet = name;
      document.querySelectorAll('.planet-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateEquations();
      resetSim();
    };
    container.appendChild(btn);
  });
}

// ─── Scenario switching ───────────────────────────────────────────────────────
function setScenario(s) {
  scenario = s;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  buildControls();
  resetSim();
}

function toggleSim() {
  running = !running;
  if(running) { lastTime = null; animId = requestAnimationFrame(tick); }
}

function resetSim() {
  running = false;
  if(animId) cancelAnimationFrame(animId);
  t = 0; lastTime = null; trailPoints = [];
  draw();
}

function draw() {
  const sc = SCENARIOS[scenario];
  const g = BODIES[planet].g;
  const body = BODIES[planet];
  const state = scenario==='orbit'
    ? sc.simulate(params, body, t)
    : sc.simulate(params, g, t);
  sc.draw(params, scenario==='orbit' ? body : g, state);
  updateStats(sc.stats(state, params, body));
}

// ─── Canvas click (launch) ────────────────────────────────────────────────────
canvas.addEventListener('click', () => {
  if(!running) { running = true; lastTime = null; animId = requestAnimationFrame(tick); }
  else { running = false; }
});

// ─── Init ─────────────────────────────────────────────────────────────────────
buildPlanetBtns();
buildControls();
resize();
</script>
</body>
</html>
